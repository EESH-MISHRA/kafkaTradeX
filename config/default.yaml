# config/default.yaml
# Every tunable parameter lives here — never hardcoded in strategy/engine code (Rules.md §1).
# See Quant_Math_Spec.md §13 for the execution/stats/risk_math/monitoring/volatility/canaries sections.

project:
  timezone: Asia/Kolkata
  seed: 42
  mode: research              # research | paper | signals (no live order mode exists — see Rules.md)

data:
  instruments: ["NIFTY", "BANKNIFTY"]   # then top-50 liquid stocks — point-in-time universe, see PRD.md §3.1
  timeframes: {htf: "1D", setup: "1H", trigger: "15m"}
  split: {train: 0.50, validation: 0.25, final_test: 0.25}
  index_instrument_mode: null           # TODO: "futures" (with rollover rule) or "etf" — decide and document, PRD.md §3.1
  point_in_time_universe: true          # must include delisted/removed names, not just today's constituents

indicators: {ema: [20, 50, 200], sma: [20, 50, 200], rsi: 14, atr: 14, adx: 14, vol_sma: 20, er: 20}
structure: {n_internal: 3, n_major: 10, disp_atr: 1.5, eq_tol_atr: 0.10, sweep_reclaim_bars: 3}

risk:
  risk_pct: 0.75
  max_open_trades: 3
  max_total_open_risk_pct: 3.0
  max_trades_per_day: 5
  daily_loss_limit_pct: 2.5
  weekly_loss_limit_pct: 6.0
  drawdown_kill_pct: 12       # must stay below go_no_go.max_drawdown_pct so the kill-switch fires first
  scale_out_r: 1.0
  scale_out_fraction: 0.5

costs: {file: costs.yaml, cost_stress: [1.0, 1.5, 2.0], extra_slippage_ticks: 1}

strategies:
  s1_ema_pullback: {enabled: true, stop_buffer_atr: 0.25, trail_atr: 2.5, time_stop_bars: 20}
  s2_ema_cross: {enabled: false, pairs: [[9,21],[20,50],[50,200]], stop_atr: 1.5, trail_atr: 3.0}
  s3_sma_filter: {enabled: false, buffer_atr: 0.25, stop_atr: 2.0}
  s4_rsi: {enabled: false, oversold: 30, overbought: 70}
  s5_fibonacci: {enabled: false, levels: [0.382, 0.5, 0.618, 0.705, 0.786], min_leg_atr: 3.0}
  s6_order_block: {enabled: false, zone_mode: full, use_discount_filter: true, expiry_bars: 150}
  s7_fvg: {enabled: false, min_gap_atr: 0.3, expiry_bars: 30}
  s8_ict_model: {enabled: false, use_time_window: true, windows: [["09:20","11:30"],["13:30","15:00"]]}
  s9_orb: {enabled: false, or_minutes: 15, entry_cutoff: "11:00", squareoff: "15:15"}
  s10_patterns: {enabled: false}

regime: {enabled: false, hysteresis_bars: 3, adx_trend: 25, adx_range: 20, er_trend: 0.35}

go_no_go: {min_trades: 100, min_profit_factor: 1.3, max_drawdown_pct: 15, min_months_paper: 2}

# --- Additions from Quant_Math_Spec.md §13 ---

execution:
  entry_mode: market_next_open        # market_next_open | limit_through — decide from §3.3 A/B test on train data
  rr_min: 1.5
  max_cost_r: 0.15
  gap_aware_sizing: false             # true for overnight/swing positions
  latency_stress: {tau_minutes: 2, k_lat: 1.0}
  liquidity_max_participation: 0.01

stats:
  bootstrap: {type: stationary, resamples: 10000, seed: 42}
  alpha: 0.05
  power: 0.80
  min_trades: 100
  target_trades: 250
  dsr_min: 0.95
  pbo_max: 0.20
  random_entry_runs: 500
  plateau: {neighbour_share: 0.70, rel_tolerance: 0.50}
  embargo_bars: auto                  # = max(max_holding_bars, longest_lookback)

risk_math:
  kelly_fraction: 0.25
  rho_floor_same_bucket: 0.6
  rho_index_bucket: 0.9
  corr_window_days: 120
  var_levels: [0.95, 0.99]

monitoring:
  cusum: {delta_r: 0.25, arl_trades: 200}

volatility: {estimator_daily: yang_zhang, estimator_intraday: parkinson, window: 20, ewma_lambda: 0.94}

canaries: {truncation_samples: 50, null_runs: 200}
